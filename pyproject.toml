[project]
name = "distill-safety"
version = "0.1.0"
description = "Does safety transfer subliminally through distillation? Deep (Qi et al.) vs latent-adversarial (LAT) teachers."
readme = "README.md"
authors = [
    { name = "Realmbird", email = "happychristopher777@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "lm-eval>=0.4.13",
    "matplotlib>=3.11.2",
    "pandas>=2.3.3",
    "peft==0.20.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch==2.9.0",
    "transformers==4.57.6",
    "trl==1.10.0",
    "vllm==0.13.0",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
